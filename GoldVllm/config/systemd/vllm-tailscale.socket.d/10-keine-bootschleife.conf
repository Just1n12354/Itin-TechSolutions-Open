# Drop-in for vllm-tailscale.socket (added 2026-10-02, observed on the reference GX10 on 2026-09-28).
#
# Without this, systemd implicitly adds "Before=sockets.target" to the socket, while the
# socket itself has "After=tailscaled.service" - and tailscaled only runs after
# basic.target, which contains sockets.target. That is an ordering cycle at boot; systemd
# breaks it by dropping a random job (on 2026-09-28 it was containerd -> docker failed ->
# llm-server "dependency failed").
#
# Install: /etc/systemd/system/vllm-tailscale.socket.d/10-keine-bootschleife.conf,
# then systemctl daemon-reload. The sealed .socket file stays unchanged.
[Unit]
DefaultDependencies=no
Requires=sysinit.target
After=sysinit.target
Conflicts=shutdown.target
Before=shutdown.target
